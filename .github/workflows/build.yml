name: CI

on:
  push:
    branches: [fresh]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-dynamic:
    name: Dynamic build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev

      - name: macOS deps
        if: matrix.os == 'macos-15'
        run: |
          brew update
          brew install libusb pkg-config

      - name: Windows deps
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libusb

      - name: Dynamic build
        run: |
          make clean
          make

  release-linux:
    name: Release Linux
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libtool \
            libudev-dev \
            pkg-config \
            p7zip-full

      - name: Build static libusb
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git
          cd libusb
          ./bootstrap.sh
          ./configure \
            --prefix="$GITHUB_WORKSPACE/libusb-prefix" \
            --enable-static \
            --disable-shared
          make -j"$(nproc)"
          make install

      - name: Build release binary
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libusb-prefix/lib/pkgconfig
        run: |
          make clean
          make release
          7z a sonixflasher-linux-x86_64.zip sonixflasher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonixflasher-linux-x86_64
          path: sonixflasher-linux-x86_64.zip

  release-macos:
    name: Release macOS universal
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deps
        run: |
          brew update
          brew install autoconf automake libtool pkg-config p7zip

      - name: Build static libusb arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libusb/libusb.git
          cd libusb
          ./bootstrap.sh
          export SDK=$(xcrun --sdk macosx --show-sdk-path)
          ./configure \
            --prefix="$RUNNER_TEMP/libusb-arm64" \
            --enable-static \
            --disable-shared \
            --host=aarch64-apple-darwin \
            CC="clang" \
            CFLAGS="-arch arm64 -isysroot $SDK -mmacosx-version-min=11.0" \
            LDFLAGS="-arch arm64 -isysroot $SDK -mmacosx-version-min=11.0"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build static libusb x86_64
        shell: bash
        run: |
          set -euo pipefail
          cd libusb
          make distclean || true
          export SDK=$(xcrun --sdk macosx --show-sdk-path)
          ./configure \
            --prefix="$RUNNER_TEMP/libusb-x86_64" \
            --enable-static \
            --disable-shared \
            --host=x86_64-apple-darwin \
            CC="clang" \
            CFLAGS="-arch x86_64 -isysroot $SDK -mmacosx-version-min=11.0" \
            LDFLAGS="-arch x86_64 -isysroot $SDK -mmacosx-version-min=11.0"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Combine into universal libusb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libusb-universal/lib/pkgconfig"
          lipo -create \
            "$RUNNER_TEMP/libusb-arm64/lib/libusb-1.0.a" \
            "$RUNNER_TEMP/libusb-x86_64/lib/libusb-1.0.a" \
            -output "$RUNNER_TEMP/libusb-universal/lib/libusb-1.0.a"

          sed \
            -e "s|^prefix=.*|prefix=$RUNNER_TEMP/libusb-universal|" \
            "$RUNNER_TEMP/libusb-arm64/lib/pkgconfig/libusb-1.0.pc" \
            > "$RUNNER_TEMP/libusb-universal/lib/pkgconfig/libusb-1.0.pc"

      - name: Build universal release binary
        shell: bash
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/libusb-universal/lib/pkgconfig
        run: |
          set -euo pipefail
          export SDK=$(xcrun --sdk macosx --show-sdk-path)
          make clean
          make STATIC=1 BACKEND=libusb \
            ARCHFLAGS="-arch arm64 -arch x86_64 -isysroot $SDK -mmacosx-version-min=11.0"
          lipo -info sonixflasher
          zip -j sonixflasher-macos-universal.zip sonixflasher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonixflasher-macos-universal
          path: sonixflasher-macos-universal.zip

  release-windows:
    name: Release Windows
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            p7zip
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Build static libusb
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git
          cd libusb
          ./bootstrap.sh
          ./configure \
            --prefix="$GITHUB_WORKSPACE/libusb-prefix" \
            --enable-static \
            --disable-shared
          make -j"$(nproc)"
          make install

      - name: Build release binary
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libusb-prefix/lib/pkgconfig
        run: |
          make clean
          make release
          7z a sonixflasher-windows-x86_64.zip sonixflasher.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonixflasher-windows-x86_64
          path: sonixflasher-windows-x86_64.zip

  publish-release:
    name: Publish release artifacts
    if: github.event_name == 'release'
    needs:
      - release-linux
      - release-macos
      - release-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}