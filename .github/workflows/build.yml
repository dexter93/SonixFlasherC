name: Make CI

on:
  push:
    branches: [fresh]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-dynamic:
    name: Dynamic build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS (arm64)
            os: macos-latest
          - name: Windows
            os: windows-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v6

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev

      - name: macOS deps
        if: matrix.os == 'macos-latest'
        run: brew install libusb

      - name: Windows deps
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libusb

      - name: Dynamic build
        run: |
          make clean
          make

  release-linux:
    name: Release Linux
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev libudev-dev p7zip-full

      - name: Build release binary
        run: |
          make clean
          make release
          7z a sonixflasher-linux-x86_64.zip sonixflasher

      - uses: actions/upload-artifact@v7
        with:
          name: sonixflasher-linux-x86_64
          path: sonixflasher-linux-x86_64.zip

  release-windows:
    name: Release Windows
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            p7zip
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libusb

      - name: Build release binary
        run: |
          make clean
          make release
          7z a sonixflasher-windows-x86_64.zip sonixflasher.exe

      - uses: actions/upload-artifact@v7
        with:
          name: sonixflasher-windows-x86_64
          path: sonixflasher-windows-x86_64.zip

  release-macos:
    name: Release macOS (${{ matrix.arch }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: brew install libusb

      - name: Build native release binary
        run: |
          make clean
          make release

      - uses: actions/upload-artifact@v7
        with:
          name: sonixflasher-macos-${{ matrix.arch }}
          path: sonixflasher
          if-no-files-found: error

  merge-macos-universal:
    name: Merge macOS universal binary
    needs: release-macos
    if: ${{ always() && needs.release-macos.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Download arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: sonixflasher-macos-arm64
          path: arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: sonixflasher-macos-x86_64
          path: x86_64

      - name: Create universal binary
        run: |
          set -euo pipefail
          chmod +x arm64/sonixflasher x86_64/sonixflasher
          lipo -create arm64/sonixflasher x86_64/sonixflasher -output sonixflasher
          lipo -info sonixflasher
          zip -j sonixflasher-macos-universal.zip sonixflasher

      - uses: actions/upload-artifact@v7
        with:
          name: sonixflasher-macos-universal
          path: sonixflasher-macos-universal.zip

  publish-release:
    name: Publish release artifacts
    if: github.event_name == 'release'
    needs:
      - release-linux
      - release-windows
      - merge-macos-universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: sonixflasher-*
          merge-multiple: false

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}